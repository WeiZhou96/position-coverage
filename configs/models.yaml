# Models under test. Paths are Hugging Face Hub ids; replace them with local directories if needed.
# family is used by the gates: G1 needs at least one non-qwen language model.
defaults:
  dtype: bfloat16
  attn: sdpa
  max_image_side: 1280          # same per-image budget in every condition
  batch_size: 8

models:
  qwen3vl_2b:
    path: Qwen/Qwen3-VL-2B-Instruct
    family: qwen
  qwen3vl_4b:
    path: Qwen/Qwen3-VL-4B-Instruct
    family: qwen
  qwen3vl_8b:
    path: Qwen/Qwen3-VL-8B-Instruct
    family: qwen
  internvl35_8b:
    path: OpenGVLab/InternVL3_5-8B-HF
    family: qwen                  # language model is Qwen3
    batch_size: 4
  internvl35_8b_t1:                 # P2: one 448x448 tile (256 tokens) per image, a per-image budget
    path: OpenGVLab/InternVL3_5-8B-HF   # comparable to Qwen3-VL and Gemma-3 on E3
    family: qwen                  # language model is Qwen3
    batch_size: 4
    processor_kwargs:
      crop_to_patches: false
  qwen3vl_32b:                        # P5: zero-shot, split over two GPUs
    path: Qwen/Qwen3-VL-32B-Instruct
    family: qwen
    batch_size: 2
    device_map: auto
  internvl35_38b_t1:                        # P5: zero-shot, split over two GPUs
    path: OpenGVLab/InternVL3_5-38B-HF
    family: qwen
    batch_size: 2
    device_map: auto
    processor_kwargs:
      crop_to_patches: false
  gemma3_27b:                        # P5: zero-shot, split over two GPUs
    path: google/gemma-3-27b-it
    family: non_qwen
    batch_size: 2
    device_map: auto
  mistral32_24b:                        # P5: zero-shot, split over two GPUs
    path: mistralai/Mistral-Small-3.2-24B-Instruct-2506   # needs the processor/tokenizer files of Mistral-Small-3.1-24B-Instruct-2503 (see README)
    family: non_qwen
    batch_size: 2
    device_map: auto
    processor_kwargs:
      size:
        longest_edge: 448        # about 200 tokens per image (14-pixel patches, 2x2 merge)
  gemma3_12b:
    path: google/gemma-3-12b-it
    family: non_qwen
    batch_size: 4
